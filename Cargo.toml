[package]
authors = ["Alexis Purslane"]
autoexamples = false
categories = ["parser-implementations", "parsing", "text-editors"]
description = "A proof-of-concept tree-sitter grammar for English prose"
edition = "2024"
keywords = ["incremental", "parsing", "tree-sitter", "english"]
license = "MIT"
name = "tree-sitter-english"
readme = "README.md"
repository = "https://tangled.org/xenolandscapes.com/tree-sitter-english"
version = "0.1.0"

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "=0.27.0"

[workspace]
members = [
  "crates/english",
  "crates/english-pos",
  "crates/english-pos-train",
  "crates/english-chunk",
  "crates/english-dep",
  "crates/english-dep-train",
  "crates/english-lint",
  "crates/english-web",
]
