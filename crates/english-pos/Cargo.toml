[package]
name = "english-pos"
version = "0.1.0"
edition = "2024"
authors = ["Jonathan Morley <morley.jonathan@gmail.com>"]
license = "MIT"
description = "Statistical part-of-speech tagging for English prose (UPOS tagset)"

[dependencies]
english = { version = "0.1.0", path = "../english" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
