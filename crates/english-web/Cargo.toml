[package]
name = "english-web"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.100"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
english = { version = "0.1.0", path = "../english" }
english-pos = { version = "0.1.0", path = "../english-pos" }
english-chunk = { version = "0.1.0", path = "../english-chunk" }
english-lint = { version = "0.1.0", path = "../english-lint" }
