[package]
name = "english-pos-neural"
version = "0.1.0"
edition = "2024"
authors = ["Jonathan Morley <morley.jonathan@gmail.com>"]
license = "MIT"
description = "Batch/save-pass neural POS tagger (BiLSTM) — never keystroke; perceptron keeps that path"

[dependencies]
english-pos = { version = "0.1.0", path = "../english-pos" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "=1.0.151"
